<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>长征派出所便民联络码</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="backButton" aria-label="查看本地演示台账">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z" /><path d="M8 9h8M8 13h8M8 17h5" /></svg>
        </button>
        <div>
          <p class="eyebrow">扫码即用 · 咨询上报联络</p>
          <h1 id="pageTitle">长征派出所</h1>
        </div>
        <button class="icon-button" data-action="call" data-phone="62655555" aria-label="拨打值班电话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.09 5.18 2 2 0 0 1 5.11 3h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.63 2.61a2 2 0 0 1-.45 2.11L9 10.73a16 16 0 0 0 4.27 4.27l1.29-1.29a2 2 0 0 1 2.11-.45c.84.3 1.71.51 2.61.63A2 2 0 0 1 22 16.92z" /></svg>
        </button>
      </header>

      <main>
        <section class="view active" data-view="home">
          <button class="dial-panel" data-action="call" data-phone="62655555">
            <span>一键拨号</span>
            <strong>62655555</strong>
          </button>

          <div class="grid-menu">
            <button class="module-card priority" data-go="report">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /><circle cx="12" cy="13" r="3" /></svg>
              </span>
              <strong>隐患线索上报</strong>
            </button>
            <button class="module-card" data-go="antiFraud">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.6-2.9 7.8-7 9-4.1-1.2-7-4.4-7-9V6l7-3z" /><path d="M9.5 12.5l1.8 1.8 3.7-4.3" /></svg>
              </span>
              <strong>反诈宣传专栏</strong>
            </button>
            <button class="module-card wide" data-go="contact">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.09 5.18 2 2 0 0 1 5.11 3h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.63 2.61a2 2 0 0 1-.45 2.11L9 10.73a16 16 0 0 0 4.27 4.27l1.29-1.29a2 2 0 0 1 2.11-.45c.84.3 1.71.51 2.61.63A2 2 0 0 1 22 16.92z" /></svg>
              </span>
              <strong>社区联络员</strong>
            </button>
          </div>
        </section>

        <section class="view" data-view="report">
          <form class="form-card" id="reportForm">
            <label>
              <span>隐患/线索情况说明</span>
              <textarea name="content" rows="6" placeholder="请说明时间、地点、经过，支持语音输入" required></textarea>
            </label>
            <div class="button-row single">
              <button type="button" class="secondary-button" data-action="speech" data-target="report">语音输入</button>
            </div>
            <label>
              <span>现场照片</span>
              <input name="photo" type="file" accept="image/*" capture="environment" />
            </label>
            <div class="image-preview" id="reportPreview">可不上传照片</div>
            <label>
              <span>姓名</span>
              <input name="name" autocomplete="name" placeholder="请输入姓名" required />
            </label>
            <label>
              <span>联系电话</span>
              <input name="phone" inputmode="tel" autocomplete="tel" placeholder="请输入联系电话" required />
            </label>
            <label>
              <span>位置说明</span>
              <input name="manualAddress" placeholder="请填写小区、楼栋、门牌或附近标志物" required />
            </label>
            <div class="location-box" id="reportLocation">尚未获取经纬度</div>
            <div class="button-row single">
              <button type="button" class="secondary-button" data-action="locate" data-target="report">获取定位</button>
            </div>
            <button type="submit" class="primary-button">提交上报</button>
          </form>
        </section>

        <section class="view" data-view="antiFraud">
          <div class="poster-row" id="antiPosterRow"></div>
          <div class="fraud-grid" id="antiFraudList"></div>
        </section>

        <section class="view" data-view="contact">
          <div class="contact-note">
            <strong>社区联络员</strong>
            <p>按辖区联系对应民警，情况紧急请直接拨打 62655555。</p>
          </div>
          <div class="officer-list" id="officerList"></div>
        </section>

        <section class="view" data-view="ledger">
          <div class="dashboard">
            <article>
              <span>总记录</span>
              <strong id="statTotal">0</strong>
            </article>
            <article>
              <span>线索记录</span>
              <strong id="statReport">0</strong>
            </article>
            <article>
              <span>待跟进</span>
              <strong id="statOpen">0</strong>
            </article>
          </div>
          <div class="ledger-toolbar">
            <button class="secondary-button" id="exportData">导出台账</button>
            <button class="ghost-button" id="clearData">清空本机演示数据</button>
          </div>
          <div class="ledger-list" id="ledgerList"></div>
        </section>
      </main>
    </div>

    <button class="bot-launcher" id="botLauncher" type="button" aria-label="打开小长征 AI 办事咨询">
      <span class="bot-badge">小长征警官</span>
      <img class="bot-photo" src="./Q版警官形象画图.png" alt="小长征警官" />
      <span class="bot-tip">AI办事咨询</span>
    </button>

    <section class="bot-drawer" id="botDrawer" aria-label="小长征 AI 办事咨询" hidden>
      <header class="bot-drawer-head">
        <div>
          <strong>小长征警官</strong>
          <span>办事咨询 · 社区常见问题</span>
        </div>
        <button class="bot-close" id="botClose" type="button" aria-label="关闭">×</button>
      </header>
      <div class="chat-box floating" id="chatBox"></div>
      <form class="chat-input" id="chatForm">
        <input name="question" placeholder="问我办事材料、噪音扰民、养犬管理等问题" autocomplete="off" required />
        <button type="submit">发送</button>
      </form>
      <div class="quick-questions" id="quickQuestions"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
