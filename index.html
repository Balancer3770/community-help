<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>社区警务便民联络码</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="backButton" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <div>
          <p class="eyebrow">梅岭北路派出所 · 扫码即用</p>
          <h1 id="pageTitle">社区警务便民联络码</h1>
        </div>
        <button class="icon-button" data-action="call" data-phone="62655555" aria-label="拨打值班电话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.09 5.18 2 2 0 0 1 5.11 3h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.63 2.61a2 2 0 0 1-.45 2.11L9 10.73a16 16 0 0 0 4.27 4.27l1.29-1.29a2 2 0 0 1 2.11-.45c.84.3 1.71.51 2.61.63A2 2 0 0 1 22 16.92z" /></svg>
        </button>
      </header>

      <main>
        <section class="view active" data-view="home">
          <div class="notice police-notice">
            <div>
              <strong>梅岭北路派出所</strong>
              <span>求助、咨询、线索上报、办事联系</span>
            </div>
            <button class="text-button hot" data-action="call" data-phone="62655555">立即拨打</button>
          </div>

          <button class="dial-panel" data-action="call" data-phone="62655555">
            <span>一键拨号</span>
            <strong>62655555</strong>
          </button>

          <div class="grid-menu">
            <button class="module-card priority" data-go="help">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3L12 3z" /><path d="M12 9v4M12 17h.01" /></svg>
              </span>
              <strong>一键紧急求助</strong>
            </button>
            <button class="module-card" data-go="consult">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z" /></svg>
              </span>
              <strong>警务咨询</strong>
            </button>
            <button class="module-card" data-go="report">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /><circle cx="12" cy="13" r="3" /></svg>
              </span>
              <strong>线索上报</strong>
            </button>
            <button class="module-card" data-go="services">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z" /><path d="M8 8h8M8 12h8M8 16h5" /></svg>
              </span>
              <strong>便民办事</strong>
            </button>
            <button class="module-card wide" data-go="contact">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.09 5.18 2 2 0 0 1 5.11 3h3a2 2 0 0 1 2 1.72c.12.9.33 1.77.63 2.61a2 2 0 0 1-.45 2.11L9 10.73a16 16 0 0 0 4.27 4.27l1.29-1.29a2 2 0 0 1 2.11-.45c.84.3 1.71.51 2.61.63A2 2 0 0 1 22 16.92z" /></svg>
              </span>
              <strong>社区联络员</strong>
            </button>
          </div>
        </section>

        <section class="view" data-view="help">
          <form class="form-card" id="helpForm">
            <label>
              <span>姓名</span>
              <input name="name" autocomplete="name" placeholder="请输入姓名" />
            </label>
            <label>
              <span>联系电话</span>
              <input name="phone" inputmode="tel" autocomplete="tel" placeholder="便于民警及时回拨" required />
            </label>
            <label>
              <span>求助内容</span>
              <textarea name="content" rows="5" placeholder="请简单说明情况，也可以使用下方语音输入" required></textarea>
            </label>
            <div class="location-box" id="helpLocation">尚未获取位置</div>
            <div class="button-row">
              <button type="button" class="secondary-button" data-action="locate" data-target="help">获取定位</button>
              <button type="button" class="secondary-button" data-action="speech" data-target="help">语音输入</button>
            </div>
            <button type="submit" class="primary-button danger">提交求助</button>
            <button type="button" class="ghost-button hotline-button" data-action="call" data-phone="62655555">直接拨打 62655555</button>
          </form>
          <div class="quiet-panel">
            <h3>低调求助模式</h3>
            <p>适合不方便长时间操作手机时使用。当前演示版可记录定位与录音事件，正式上线建议对接后端存储和权限管理。</p>
            <button class="secondary-button" data-go="quiet">进入低调模式</button>
          </div>
        </section>

        <section class="view quiet-view" data-view="quiet">
          <div class="quiet-status">
            <span>低调模式</span>
            <strong id="quietTimer">00:00</strong>
            <p id="quietHint">点击按钮后会请求浏览器录音权限，录音仅在当前页面演示有效。</p>
          </div>
          <div class="quiet-actions">
            <button class="round-action" id="quietLocate" aria-label="发送位置">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-4.6 7-11a7 7 0 0 0-14 0c0 6.4 7 11 7 11z" /><circle cx="12" cy="10" r="2.5" /></svg>
            </button>
            <button class="round-action danger" id="recordButton" aria-label="录音">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" /></svg>
            </button>
          </div>
        </section>

        <section class="view" data-view="consult">
          <div class="chat-box" id="chatBox"></div>
          <form class="chat-input" id="chatForm">
            <input name="question" placeholder="输入想咨询的问题，例如：居住登记需要什么材料" autocomplete="off" required />
            <button type="submit">发送</button>
          </form>
          <div class="quick-questions" id="quickQuestions"></div>
        </section>

        <section class="view" data-view="report">
          <form class="form-card" id="reportForm">
            <label>
              <span>线索类型</span>
              <select name="category">
                <option value="AI 自动判断">AI 自动判断</option>
                <option value="治安隐患">治安隐患</option>
                <option value="消防隐患">消防隐患</option>
                <option value="邻里纠纷">邻里纠纷</option>
                <option value="环境秩序">环境秩序</option>
              </select>
            </label>
            <label>
              <span>情况说明</span>
              <textarea name="content" rows="5" placeholder="例如：楼道堆放杂物，有安全隐患" required></textarea>
            </label>
            <label>
              <span>现场照片</span>
              <input name="photo" type="file" accept="image/*" capture="environment" />
            </label>
            <div class="image-preview" id="reportPreview">未选择照片</div>
            <div class="location-box" id="reportLocation">尚未获取位置</div>
            <button type="button" class="secondary-button" data-action="locate" data-target="report">获取定位</button>
            <button type="submit" class="primary-button">提交线索</button>
          </form>
        </section>

        <section class="view" data-view="services">
          <div class="service-tabs" id="serviceTabs"></div>
          <div class="service-detail" id="serviceDetail"></div>
        </section>

        <section class="view" data-view="contact">
          <div class="station-card">
            <strong>梅岭北路派出所</strong>
            <span>单位地址：梅岭北路1238号</span>
            <p>如情况紧急、表达不便或需要当面求助，也可以直接来所反映。</p>
            <button class="text-button hot" data-action="call" data-phone="62655555">拨打值班电话 62655555</button>
          </div>
          <div class="officer-list" id="officerList"></div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
